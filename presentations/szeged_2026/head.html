<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toward Autonomous Spatial Intelligence — Szeged 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/reveal.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.3.1/theme/white.min.css">
    <style>
        :root { --blue: #2563eb; --blue-light: #dbeafe; --green: #059669; --red: #dc2626; --amber: #d97706; --purple: #7c3aed; --slate: #334155; --muted: #64748b; --border: #e2e8f0; }
        body { background-color: #f8fafc; }
        .reveal { font-family: 'Inter', sans-serif; font-size: 34px; }
        .reveal h1, .reveal h2, .reveal h3 { color: #0f172a; font-family: 'Inter', sans-serif; text-transform: none; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; }
        .reveal p, .reveal li { color: var(--slate); font-family: 'Inter', sans-serif; line-height: 1.45; margin: 0 0 6px 0; }
        .accent { color: var(--blue); font-weight: 800; }
        .card { background: #fff; border-radius: 10px; padding: 16px 18px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); text-align: left; }
        .card.blue { border-top: 4px solid var(--blue); }
        .card.green { border-top: 4px solid var(--green); }
        .card.red { border-top: 4px solid var(--red); }
        .card.amber { border-top: 4px solid var(--amber); }
        .callout { background: var(--blue-light); border-left: 5px solid var(--blue); border-radius: 8px; padding: 12px 16px; text-align: left; margin: 10px 0; }
        .callout p { color: #1e40af; margin: 0; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
        .citation { font-size: 0.44em; color: var(--muted); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); text-align: left; }
        .chip { display: inline-block; padding: 6px 12px; border-radius: 6px; font-family: monospace; font-weight: 700; font-size: 0.9em; margin: 3px; }
        .chip-blue { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
        .chip-red { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .reveal img { border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.09); }
    </style>
</head>
<body>
<div class="reveal"><div class="slides">
